<!-- 功能頁面區 -->
<div class="manage_page main_scroll_mini_4 flex csp-style-14">
    <div id="api_list_view" class="search_type api_manage">
		<div class="api_interview">
			<div class="row_text2">簡介</div>
			<div>本功能提供使用者利用API進行資料轉換，如果需要進行API服務者請先進行申請作業程序。</div>
		</div>
		<div class="api_interview">
			<div class="row_text2">API服務列表</div>
			<div class="main_scroll_mini_4 row_table_zone">
				<table class="table_c api_tab_list">
					<thead>
						<tr>
							<th>序號</th>
							<th>服務名稱</th>
							<th>上架日期</th>
							<th>說明</th>
							<th>使用次數</th>
							<th>申請</th>
						</tr>
					</thead>
					<tbody id="api_tab_list" class="ztbody"></tbody>
				</table>
			</div>
		</div>
		<div class="api_interview">
			<div class="row_text2">API使用說明</div>
			<div id="api_tab_illustrate">
			</div>
		</div>
	</div>
	<div id="api_apply_view" class="search_type api_manage">
		<input id="api_apply_targetid" type="text" autocomplete="off"  class="csp-style-12" />
		<div class="api_interview">
			<div class="row_text2">API服務申請</div>
		</div>
		<div class="api_interview">
			<div class="row_text2">基本資料</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					申請單編號
				</div>
				<div id="apply_api_guid" class="col-md-4 col-sm-6 col-6 sys_col2">
					(由系統自動產生)
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					申請時間
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<label id= "apply_api_time"></label>
				</div>
			</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					姓名
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="apply_api_name" class="form-control form-custom-select" type="text" placeholder="輸入申請人姓名" autocomplete="off" />
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					服務單位
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="apply_api_unit" class="form-control form-custom-select" type="text" placeholder="輸入申請人服務單位" autocomplete="off" />
				</div>
			</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					電子信箱
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="apply_api_mail" class="form-control form-custom-select" type="text" placeholder="輸入申請人電子信箱" autocomplete="off" />
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					聯絡電話
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="apply_api_phone" class="form-control form-custom-select" type="text" placeholder="輸入申請人聯絡電話" autocomplete="off" />
				</div>
			</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					使用期間
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="apply_api_start" class="form-control form-custom-select" type="text" placeholder="yyyy/mm/dd" autocomplete="off" />
					至
					<input id="apply_api_end" class="form-control form-custom-select" type="text" placeholder="yyyy/mm/dd" autocomplete="off" />
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					用途
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<textarea id="apply_api_use" placeholder="輸入申請用途" autocomplete="off"></textarea>
				</div>
			</div>
		</div>
		<div class="api_interview">
			<div class="row_text2">API服務資料</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					介接應用程式名稱
				</div>
				<div id="api_apply_targetname" class="col-md-4 col-sm-6 col-6 sys_col2">
					(由系統自動產生)
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					IP(或Domain)1
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="api_apply_ip1" class="form-control form-custom-select" type="text" placeholder="輸入第一組IP或DOMAIN" autocomplete="off" />
				</div>
			</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					IP(或Domain)2
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="api_apply_ip2" class="form-control form-custom-select" type="text" placeholder="輸入第二組IP或DOMAIN" autocomplete="off" />
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					IP(或Domain)3
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="api_apply_ip3" class="form-control form-custom-select" type="text" placeholder="輸入第三組IP或DOMAIN" autocomplete="off" />
				</div>
			</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					IP(或Domain)4
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="api_apply_ip4" class="form-control form-custom-select" type="text" placeholder="輸入第四組IP或DOMAIN" autocomplete="off" />
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col1">
					IP(或Domain)5
				</div>
				<div class="col-md-4 col-sm-6 col-6 sys_col2">
					<input id="api_apply_ip5" class="form-control form-custom-select" type="text" placeholder="輸入第五組IP或DOMAIN" autocomplete="off" />
				</div>
			</div>
		</div>
		<div class="api_interview AllCenter">
			<button type="button" class="btn btn-warning search_submit custom_bt2" data-csp-onclick="ApplyApiClear();">取消</button>
			<button type="button" class="btn btn-success search_submit custom_bt2" data-csp-onclick="SentApplyApi();">送出</button>
		</div>
	</div>
	<!-- 功能頁面區 -->
</div>
<script src="./js/csp-inline/views_2f_api_5f_manage_1.js"></script>
