<div class="content_row_data" id="basic_data_new">
	<div class="row_text">基本資料</div>
	<!-- 新增異動的基本資料 -->
	<div>
	<form id="te_data_basic_new">	
	
	<div class="new_ver_flex">
	   <div>
	   <label for="te_data_basic_createuser" class="form-label"  style="width: 140px;">建立者</label>
	   </div>
	   <div id="te_data_basic_new_createuser"></div>
	</div>
	
	<div class="new_ver_flex">
	   <div>
	   <label for="te_data_basic_createtime" class="form-label"  style="width: 140px;">建立時間</label>
	   </div>
	   <div id="te_data_basic_new_createtime"></div>

	</div>
	
	<div class="new_ver_flex">
	   <div>
	   <label for="te_data_basic_new_deptart" class="form-label"  style="width: 140px;">所屬單位</label>
	   </div>
		<div id="te_data_basic_new_deptart"></div>

	</div>
	
	<div class="new_ver_flex">
	   <div>
	   <label for="te_data_basic_new_title" class="form-label"  style="width: 140px;">標題</label>
	   </div>
	   <input id="te_data_basic_new_title" type="text" class="form-control" />
	</div>
	
	<div class="new_ver_flex">
	   <div>
	   <label for="te_data_basic_new_note" class="form-label"  style="width: 140px;">說明</label>
	   </div>
	   <textarea id="te_data_basic_new_note" type="text" class="form-control"rows="3"></textarea>
	</div>
	
	<div class="new_ver_flex">
	   <div>
	   <label for="te_data_basic_new_file" class="form-label"  style="width: 140px;">附件</label>
	   </div>
	   <div style="width: 100%;">
	   <input id="te_data_basic_new_file" type="file" class="form-control" multiple onchange="FileListUpload()" />
	   <!-- 隱藏用上傳INPUT -->
	   <div id="te_data_basic_hidden_list" style="display: none;">
	   </div>
	   <div id="te_data_basic_file_list"></div>
	   </div>
	   </div>
	</form >	
	</div>
	<!-- 選取異動的基本資料 -->
</div>

<script>
    newApplyDetail();
	var filelist = new Array();
	function FileListUpload() {
		var input = document.getElementById("te_data_basic_new_file");
		var output = document.getElementById("te_data_basic_file_list");

		var clone = $("#te_data_basic_new_file").clone();
		clone.attr("class", "hiddenupload");
		$("#te_data_basic_hidden_list").append(clone);
		
		var HTML = "<table style=\"width: 500px;\">";
		for (var i = 0; i < input.files.length; i++) {
			filelist.push(input.files.item(i));
		}
		
		for (var i = 0; i < filelist.length; i++) {
			HTML += "<tr><td>" + filelist[i].name + "</td><td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button class=\"btn btn-danger\" onclick=UploadDeleteThis(" + i + ")>刪除</button></td></tr>";
		}

		HTML += "</table>";
		output.innerHTML = HTML;
		
		$("#te_data_basic_new_file").replaceWith($("#te_data_basic_new_file").val('').clone(true));
	}
	function UploadDeleteThis(idx) {
		var output = document.getElementById("te_data_basic_file_list");
		filelist.splice(idx, 1);
		var HTML = "<table style=\"width: 500px;\">";
		
		for (var i = 0; i < filelist.length; i++) {
			HTML += "<tr><td>" + filelist[i].name + "</td><td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button class=\"btn btn-danger\" onclick=UploadDeleteThis(" + i + ")>刪除</button></td></tr>";
		}
		output.innerHTML = HTML;
		
		var hiddenlist = document.getElementsByClassName("hiddenupload");
		for (var i = 0; i < hiddenlist.length; i++) {
			if (i == idx) hiddenlist[i].remove();
		}
	}
</script>
