<!-- 頁面區 -->
<div class="manage_page">
	<div class="search_div">
		<div class="content_row_search">
			<div class="row_text">篩選條件</div>
			<div class="new_ver_flex">
			<div>
			   <label for="ver_year" class="form-label csp-style-43">年度</label>
			 </div>
			   <select id="ver_year0" class="form-select" >
				  <option value="-1" selected>不指定</option>
				</select>
			</div>
			<div class="new_ver_flex">
				<div>
					<label for="search_id" class="form-label csp-style-43">識別碼</label>
				</div>
				<input id="search_id" type="text" class="form-control" />
			</div>
			<div class="new_ver_flex">
				<div>
					<label for="search_title" class="form-label csp-style-43" >標題關鍵字</label>
				</div>
				<input id="search_title" type="text" class="form-control" />
			</div>

			<div class="new_ver_flex">
				<div>
					<label for="search_stat" class="form-label csp-style-43" >狀態</label>
				</div>
				<select id="search_stat" class="form-select"  >
					<option value="-1" selected>不指定</option>
					<option value="0">未送出</option>
					<option value="1">未確認</option>
					<option value="2">退回修正</option>
					<option value="3">已通過</option>
					<option value="4">取消異動</option>
				</select>
			</div>
			<div class="new_ver csp-style-3">
				<button type="button" class="btn btn-success search_submit custom_bt2" data-csp-onclick="get_te_manage_containerTable();">查詢</button>
				<button type="button" class="btn btn-warning search_submit custom_bt2" data-csp-onclick="te_manage_reset();">重置</button>
			</div>
		</div>
		<div class="content_row_search csp-style-161">
			<div class="row_text">異動列表</div>
			<div class="result_list main_scroll_mini">
				<!-- <異動列表資料> -->
				<table class="table te_tab_list" id="te_tab1_list">
				</table>
				<!-- <異動列表資料> -->
			</div>
		</div>
	</div>

	<div class="detail_data main_scroll csp-style-12">
		<!-- <編輯功能區 需確認權限是否可以編輯或刪除> -->
		<div class="content_row_data manage_bt_area csp-style-162">
			<div class="normal_state manage_bt">
			   <button type="button" class="btn btn-success search_submit custom_bt2" id="detail_edit">編輯</button>
			   <!-- //送審功能僅在未送審狀態下出現 -->
			   <button type="button" class="btn btn-info search_submit custom_bt2" id="sent_apply">送出</button>
			</div>
			<div class="edit_state manage_bt">
				<button type="button" class="btn btn-success search_submit custom_bt2" id="detail_save">儲存</button>
				<button type="button" class="btn btn-warning search_submit custom_bt2" id="detail_cancel">取消</button>
				<button type="button" class="btn btn-danger search_submit custom_bt2 manage_delete" id="detail_delete">刪除</button>
			</div>
			<div class="pass_state manage_bt">
				<button type="button" class="btn btn-danger search_submit custom_bt2" id="detail_cancelchange">取消異動</button>
			</div>
		</div>
		<!-- <基本資料> -->
		<div class="data_frame">

		</div>
		<!-- <基本資料> -->

		<!-- <圖資資料> -->
		<div class="list_frame">

		</div>
		<!-- <圖資資料> -->
	</div>
</div>

<!-- 頁面區 -->
<!-- <取消異動MODAL> -->
<div class="modal fade main_scroll" id="CancelChange" tabindex="-1" data-bs-backdrop="static" aria-labelledby="NewPageview" aria-hidden="false">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h5 id="addnewte_modal" class="modal-title">取消異動</h5>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-6 col-sm-6 col-6 sys_col1">
						取消人員
					</div>
					<div id="cancel_name" class="col-md-6 col-sm-6 col-6 sys_col2">

					</div>
				</div>
				<div class="row">
					<div class="col-md-6 col-sm-6 col-6 sys_col1">
						取消時間
					</div>
					<div id="cancel_time" class="col-md-6 col-sm-6 col-6 sys_col2">

					</div>
				</div>
				<div class="row">
					<div class="col-md-6 col-sm-6 col-6 sys_col1">
						取消異動原因
					</div>
					<div class="col-md-6 col-sm-6 col-6 sys_col2">
						<textarea id="cancel_note" type="text" class="form-control" rows="3" placeholder="輸入案由"></textarea>
					</div>
				</div>
			</div>
			<div class="modal-footer csp-style-13">
				<button type="button" class="btn btn-warning search_submit custom_bt2" data-csp-onclick="te_manage_cancelchange_hide();">取消</button>
				<button type="button" class="btn btn-success search_submit custom_bt2" data-csp-onclick="te_manage_cancelchange_sent();">確定</button>
			</div>
		</div>
	</div>
</div>
<!-- <取消異動MODAL> -->
<script src="./js/csp-inline/views_2f_te_5f_manage_5f_tab1_1.js"></script>
